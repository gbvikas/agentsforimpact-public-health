<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EquiVita Field Report</title>
<style>
:root{--bg:#f7f4ee;--card:#fffdf9;--ink:#1f2a37;--muted:#6b7280;--line:#e8e2d6;--brand:#0f766e;--brand-soft:#dff3ef;--sun:#d97706;--sun-soft:#fdf0dc;--lock:#6d28d9;--lock-soft:#efe7fd}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--card:#1a201e;--ink:#e7ece9;--muted:#9aa5a0;--line:#2a332f;--brand:#4fd1c0;--brand-soft:#173430;--sun:#f5a524;--sun-soft:#3a2b12;--lock:#c4a5ff;--lock-soft:#2b2140}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
.logo{font-size:22px;font-weight:800}.logo span{color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
label{font-weight:600;display:block;margin-bottom:6px}
select,textarea,button{font:inherit;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px;width:100%}
textarea{min-height:150px}
.row{display:flex;gap:10px;margin-top:10px}.row button{width:auto;flex:1}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
button.mic{font-weight:700}button.mic.on{background:#dc2626;border-color:#dc2626;color:#fff}
button:disabled{opacity:.55}
.muted{color:var(--muted)}.small{font-size:13px}
.fact{padding:8px 0;border-bottom:1px dashed var(--line)}.fact b{display:block;font-size:13px;color:var(--muted);font-weight:600}
.lock{background:var(--lock-soft);color:var(--lock);border-radius:10px;padding:8px 10px;font-weight:600;margin-top:10px}
.q{background:var(--sun-soft);border-radius:10px;padding:10px 12px;margin-top:10px}
.ok{background:var(--brand-soft);border-radius:10px;padding:10px 12px;margin-top:10px}
</style>
</head>
<body><div class="wrap">
  <div class="logo">Equi<span>Vita</span> · field report</div>
  <div class="muted small">For the nurse practitioner on the drive back. Tell us what the place taught you. EquiVita keeps place-level facts only; anything about a person is removed.</div>

  <div class="card">
    <label for="stop">Which stop?</label>
    <select id="stop"><option>Loading this month's stops…</option></select>
    <label for="text" style="margin-top:12px">What happened?</label>
    <textarea id="text" placeholder="e.g. We parked at the church on 115th, only 9 people came. Most walked from the apartments across the expressway. Four asked if we take Medicaid. There's a free clinic at St. Columba we didn't know about."></textarea>
    <div class="row">
      <button class="mic" id="mic">🎙️ Speak</button>
      <button class="primary" id="send">Save report</button>
    </div>
    <div class="row"><button id="sample" class="small">Fill a sample debrief</button></div>
    <div class="small muted" id="status" style="margin-top:8px"></div>
  </div>

  <div class="card" id="result" hidden></div>
  <div class="small muted" style="margin-top:14px"><a href="/">← Back to the plan</a> · <a href="/console">How we decided</a></div>
</div>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=(p,o)=>fetch(p,o).then(async r=>{if(!r.ok)throw new Error(await r.text());return r.json()});
function tractName(g){const t=g.slice(5);return`Census tract ${parseInt(t.slice(0,4),10)}${t.slice(4)!=='00'?'.'+t.slice(4):''}`}

(async()=>{try{const ids=await api('/api/runs');if(!ids.length){$('#stop').innerHTML='<option value="">No plan yet</option>';return}
  const run=await api('/api/runs/'+ids[0]);const det=Object.fromEntries((run.stop_details||[]).map(d=>[d.geo_id,d]));
  $('#stop').innerHTML=(run.final_plan?.stops||[]).map(s=>{const c=det[s.geo_id]?.clinic;const label=`Saturday ${s.saturday} · ${tractName(s.geo_id)}`;
    return `<option value="${esc(s.geo_id)}" data-label="${esc(label)}">${esc(label)}</option>`}).join('')}catch(e){$('#status').textContent='Could not load stops: '+e.message}})();

$('#sample').onclick=()=>{$('#text').value="We parked at the church lot on the main road. Only 9 people came, way fewer than we hoped. Most of them walked over from the apartments on the other side of the expressway and said the underpass felt unsafe. Mrs. Alvarez, 67 years old, told me her sugar has been high. Four people asked if we take Medicaid. Someone mentioned a free clinic at St. Columba church a few blocks east that I didn't know about. Next time we should park on the apartment side of the expressway."};

// Voice: browser speech recognition (Chrome / Edge / Safari). Falls back to typing.
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,listening=false;
if(!SR){$('#mic').disabled=true;$('#mic').textContent='🎙️ Voice not supported here';}
$('#mic').onclick=()=>{if(!SR)return;if(listening){rec.stop();return}
  rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;const base=$('#text').value;
  rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;$('#text').value=(base?base+' ':'')+t};
  rec.onend=()=>{listening=false;$('#mic').classList.remove('on');$('#mic').textContent='🎙️ Speak'};
  rec.start();listening=true;$('#mic').classList.add('on');$('#mic').textContent='⏹ Stop'};

$('#send').onclick=async()=>{const opt=$('#stop').selectedOptions[0];if(!opt?.value){$('#status').textContent='Pick a stop first.';return}
  $('#send').disabled=true;$('#status').textContent='The Field Reporter is listening…';
  try{const r=await api('/api/field-report',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({geo_id:opt.value,stop:opt.dataset.label,text:$('#text').value})});
    const x=r.record||{};$('#result').hidden=false;$('#status').textContent='';
    const list=a=>(a||[]).map(v=>typeof v==='object'?`${esc(v.name)}${v.where?' ('+esc(v.where)+')':''}`:esc(v)).join(' · ')||'—';
    $('#result').innerHTML=`<div style="display:flex;align-items:center;gap:8px"><b style="font-size:18px">Saved to memory</b><span class="muted small">${esc(x.report_id)}</span></div>
      <div class="muted small">${esc(x.stop)}</div>
      <div class="fact"><b>Summary</b>${esc(x.summary)}</div>
      <div class="fact"><b>Turnout</b>${x.turnout??'—'}</div>
      <div class="fact"><b>What got in the way</b>${list(x.barriers)}</div>
      <div class="fact"><b>Free or low-cost care we didn't know about</b>${list(x.unlisted_clinics)}</div>
      <div class="fact"><b>What people asked for</b>${list(x.demand_signals)}</div>
      <div class="fact"><b>Where to go next time</b>${esc(x.suggested_shift)||'—'}</div>
      <div class="lock">🔒 ${x.dropped_personal_details||0} personal detail(s) removed. EquiVita plans places, not people.</div>
      ${x.follow_up_question?`<div class="q"><b>One question back:</b> ${esc(x.follow_up_question)}</div>`:''}
      <div class="ok">Next month's planner will read this report. <a href="/">Plan next month →</a></div>`;
  }catch(e){$('#status').textContent='Could not save: '+e.message}finally{$('#send').disabled=false}};
</script>
</body>
</html>
